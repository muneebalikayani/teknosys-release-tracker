<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEKNOSYS · Release Tracker</title>
  <meta name="description"
    content="Enterprise data warehouse release tracking and deployment calendar system with automatic holiday conflict detection.">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300d4a4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='12' cy='5' rx='9' ry='3'/><path d='M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5'/><path d='M3 12c0 1.66 4 3 9 3s9-1.34 9-3'/></svg>">
  <link rel="stylesheet" href="./index.css">
</head>

<body>
  <!-- Global Top Navigation Bar -->
  <header class="navbar">
    <div class="nav-top-row">
      <div class="nav-brand-group">
        <a href="#" class="brand-logo" id="brand-logo-link">
          <div class="brand-icon-box">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="2.3"
              stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
              <path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"></path>
            </svg>
          </div>
          <div>
            <div class="brand-title">
              TEKNOSYS <span class="brand-badge">DW v9</span>
            </div>
            <div class="text-xs text-muted brand-sub">Release Tracker</div>
          </div>
        </a>

        <div class="nav-status-pills">
          <div class="live-pill" id="nav-live-pill">
            <span class="pulse"></span>
            <span id="nav-release-count">44 Releases</span>
          </div>
          <div class="live-pill holiday-pill" id="nav-holidays-pill">
            <span id="nav-holiday-count">21 Holidays</span>
          </div>
        </div>
      </div>

      <!-- Top Right Actions -->
      <div class="nav-actions">
        <button class="live-pill db-pill disconnected" id="nav-db-btn" title="Supabase Database Settings">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
          <span id="nav-db-status">Cloud DB</span>
        </button>

        <button class="btn btn-secondary btn-icon btn-sm" id="btn-sync-cloud" title="Sync / Refresh Data from Cloud" style="height: 28px; width: 28px; padding: 0;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>

        <button class="btn btn-primary btn-sm mobile-quick-add" id="btn-mobile-new-release" title="New Release">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="btn-text-desktop">New Release</span>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs Wrapper (Responsive Horizontal Scroller on Mobile) -->
    <div class="nav-tabs-wrapper">
      <nav class="nav-tabs" id="main-nav-tabs">
        <button class="nav-tab-btn active" data-view="dashboard">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span>Dashboard</span>
        </button>

        <button class="nav-tab-btn" data-view="releases">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
          <span>Tracker List</span>
        </button>

        <button class="nav-tab-btn" data-view="board">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="9" y1="3" x2="9" y2="21"></line>
            <line x1="15" y1="3" x2="15" y2="21"></line>
          </svg>
          <span>Workflow Board</span>
        </button>

        <button class="nav-tab-btn" data-view="calendar">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Month Calendar</span>
        </button>

        <button class="nav-tab-btn" data-view="timeline">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="6" x2="16" y2="6"></line>
            <line x1="8" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="14" y2="18"></line>
          </svg>
          <span>Gantt Timeline</span>
        </button>

        <button class="nav-tab-btn" data-view="year">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Year View</span>
        </button>

        <button class="nav-tab-btn" data-view="holidays">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
            </path>
          </svg>
          <span>Holidays</span>
        </button>

        <button class="nav-tab-btn" data-view="report">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>Executive Report</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Main View Container -->
  <main class="app-main" id="view-container">
    <!-- Active view content renders here -->
  </main>

  <script type="module" src="./src/main.js"></script>
</body>

</html>
